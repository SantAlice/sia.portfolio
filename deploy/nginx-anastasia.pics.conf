# Example only: apply after inspecting the existing web server configuration.
# Does not replace nginx.conf, a default host, or either existing site's host.
server {
    listen 80;
    server_name anastasia.pics www.anastasia.pics;
    root /var/www/anastasia.pics/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/anastasia.pics.access.log;
    error_log /var/log/nginx/anastasia.pics.error.log;

    location = /analytics-config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
    location ~* \.(?:css|js|woff2?|ttf|webp|jpg|jpeg|png|svg|mp4)$ {
        expires 7d;
        try_files $uri =404;
    }
}
